CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_HID=y
CONFIG_USB_DEVICE_PRODUCT="Zephyr FIDO2 Sample"
CONFIG_USB_DEVICE_PID=0x0012
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=n
CONFIG_ENABLE_HID_INT_OUT_EP=y
CONFIG_HID_INTERRUPT_EP_MPS=64
CONFIG_USB_HID_REPORTS=1

CONFIG_FIDO2=y
CONFIG_FIDO2_TRANSPORT_USB_HID=y
CONFIG_FIDO2_ATTESTATION_SELF=y
CONFIG_FIDO2_PIN_PROTOCOL=n
CONFIG_FIDO2_TEST_USER_VERIFICATION=y

CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_PSA_CRYPTO_C=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=8192

CONFIG_LOG=y
CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_FIDO2_LOG_LEVEL_INF=y
CONFIG_USB_DRIVER_LOG_LEVEL_WRN=y
CONFIG_USB_DEVICE_LOG_LEVEL_WRN=y
CONFIG_USB_HID_LOG_LEVEL_WRN=y
