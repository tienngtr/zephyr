CONFIG_USBD_HID_SUPPORT=y

CONFIG_FIDO2=y
CONFIG_FIDO2_TRANSPORT_USB_HID=y
CONFIG_FIDO2_STORAGE_NONE=y
CONFIG_FIDO2_ATTESTATION_SELF=y
CONFIG_FIDO2_PIN_PROTOCOL=n

CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_SECURE_STORAGE_ITS_STORE_IMPLEMENTATION_SETTINGS=y

